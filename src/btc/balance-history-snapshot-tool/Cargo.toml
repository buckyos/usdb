[package]
name = "balance-history-snapshot-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
balance-history = { path = "../balance-history" }
usdb-util = { path = "../usdb-util" }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
named-lock = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
toml = "0.9"

[dev-dependencies]
bitcoincore-rpc = "0.19"
