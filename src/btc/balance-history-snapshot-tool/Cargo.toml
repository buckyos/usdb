[package]
name = "balance-history-snapshot-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
balance-history = { path = "../balance-history" }
usdb-util = { path = "../usdb-util" }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
indicatif = "0.18"
named-lock = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
toml = "0.9"

[dev-dependencies]
bitcoincore-rpc = "0.19"
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3.23"

[[test]]
name = "split_snapshot_audit"
path = "../../../tests/split_snapshot_audit.rs"
