[package]
name = "usdb-indexer-checkpoint-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
balance-history = { path = "../balance-history" }
usdb-util = { path = "../usdb-util" }
base64 = "0.22"
bitcoincore-rpc = "0.19"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
log = "0.4"
named-lock = "0.4"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rust-rocksdb = "0.52"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
jsonrpc-core = "18"
jsonrpc-http-server = "18"
toml = "0.9"
