name: Legacy Public Services Build (moved to usdb-explorer)

# Retain the workflow identity so the legacy publisher can resolve its historical runs.
# New public tag pushes no longer trigger a build in the node repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moved:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Explain the independent explorer release entry point
        run: |
          echo '::error::Explorer builds moved to buckyos/usdb-explorer. Create a vX.Y.Z tag there, then run release-publish.yml.'
          exit 1
