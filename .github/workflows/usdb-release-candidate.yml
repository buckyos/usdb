name: USDB Release Candidate Manifest

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable deployment release ID, for example usdb-testnet-v0-r1
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read

concurrency:
  group: usdb-release-candidate-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Verify inputs and create manifest
    if: github.repository == 'buckyos/usdb'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testnet-release-candidate
    steps:
      - name: Validate release ID
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^usdb-(testnet|mainnet)-v[0-9]+-r[1-9][0-9]*$ ]] || {
            echo "invalid USDB release ID: $RELEASE_ID" >&2
            exit 1
          }

      - name: Check out release coordinator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_id }}
          path: usdb
          fetch-depth: 0
          persist-credentials: false

      - name: Check out go-ethereum revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buckyos/go-ethereum
          ref: refs/tags/${{ inputs.release_id }}
          path: go-ethereum
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated release tags and master ancestry
        id: revisions
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local directory="$1"
            local branch="$2"
            local tag_ref="refs/tags/${RELEASE_ID}"
            local revision
            [[ "$(git -C "$directory" cat-file -t "$tag_ref")" == "tag" ]] || {
              echo "$directory release tag must be annotated: $RELEASE_ID" >&2
              exit 1
            }
            revision="$(git -C "$directory" rev-list -n 1 "$tag_ref")"
            [[ "$(git -C "$directory" rev-parse HEAD)" == "$revision" ]] || {
              echo "$directory checkout does not match release tag target" >&2
              exit 1
            }
            git -C "$directory" fetch --no-tags origin \
              "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git -C "$directory" merge-base --is-ancestor \
              "$revision" "refs/remotes/origin/${branch}" || {
              echo "$directory release tag target is not in ${branch} history" >&2
              exit 1
            }
            printf '%s\n' "$revision"
          }

          usdb_revision="$(verify_release_tag usdb master)"
          go_revision="$(verify_release_tag go-ethereum master)"
          tagger_epoch="$(git -C usdb for-each-ref \
            --format='%(taggerdate:unix)' "refs/tags/${RELEASE_ID}")"
          [[ "$tagger_epoch" =~ ^[0-9]+$ ]] || {
            echo "USDB release tag has no canonical tagger timestamp" >&2
            exit 1
          }
          created_at="$(date -u --date="@${tagger_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          go_release_version="$(jq -er '.toolchains.go_release' \
            go-ethereum/scripts/usdb/ci-revisions.json)"
          [[ "$go_release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release Go toolchain version: $go_release_version" >&2
            exit 1
          }
          {
            echo "usdb_revision=$usdb_revision"
            echo "go_ethereum_revision=$go_revision"
            echo "created_at_utc=$created_at"
            echo "go_release_version=$go_release_version"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve compatibility lock and image-producing runs
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
        run: |
          set -euo pipefail
          python3 go-ethereum/scripts/usdb/ci_revisions.py validate
          gh api \
            "/repos/buckyos/usdb/actions/workflows/usdb-release-build.yml/runs?event=push&status=success&head_sha=${USDB_REVISION}&per_page=100" \
            >usdb-release-runs.json
          gh api \
            "/repos/buckyos/go-ethereum/actions/workflows/usdb-release-build.yml/runs?event=push&status=success&head_sha=${GO_ETHEREUM_REVISION}&per_page=100" \
            >go-release-runs.json
          python3 usdb/docker/scripts/tools/release_candidate_resolver.py \
            --compatibility-lock go-ethereum/scripts/usdb/ci-revisions.json \
            --usdb-runs usdb-release-runs.json \
            --go-runs go-release-runs.json \
            --usdb-revision "$USDB_REVISION" \
            --go-ethereum-revision "$GO_ETHEREUM_REVISION" \
            --release-id "$RELEASE_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out SourceDAO revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buckyos/SourceDAO
          ref: ${{ steps.candidate.outputs.source_dao_revision }}
          path: SourceDAO
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SourceDAO revision and main ancestry
        shell: bash
        env:
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
        run: |
          set -euo pipefail
          [[ "$(git -C SourceDAO rev-parse HEAD)" == "$SOURCE_DAO_REVISION" ]]
          git -C SourceDAO fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git -C SourceDAO merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "SourceDAO revision is not in main history" >&2
            exit 1
          }

      - name: Require successful SourceDAO CI check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
        run: |
          set -euo pipefail
          require_check() {
            local repository="$1"
            local revision="$2"
            local check_name="$3"
            local count
            count="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${repository}/commits/${revision}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${check_name}\" and .conclusion == \"success\")] | length")"
            [[ "$count" -gt 0 ]] || {
              echo "Missing successful check '$check_name' for ${repository}@${revision}" >&2
              exit 1
            }
          }

          require_check buckyos/SourceDAO "$SOURCE_DAO_REVISION" "SourceDAO contracts"

      - name: Verify selected cross-repository compatibility lock
        run: >-
          python3 go-ethereum/scripts/usdb/ci_revisions.py verify
          --workspace-root "$GITHUB_WORKSPACE"

      - name: Validate frozen network bundle
        run: >-
          python3 usdb/docker/scripts/tools/validate_network_bundle.py
          --bundle-dir usdb/docker/networks/testnet-v0

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.revisions.outputs.go_release_version }}
          check-latest: false
          cache: false

      - name: Recompute frozen genesis block hash
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -er '.block_hash' \
            usdb/docker/networks/testnet-v0/artifacts/usdb-genesis.manifest.json)"
          actual="$(cd go-ethereum && go run ./cmd/usdb-genesis-hash \
            ../usdb/docker/networks/testnet-v0/artifacts/usdb-genesis.json)"
          [[ "$actual" == "$expected" ]] || {
            echo "genesis block hash mismatch: computed=$actual frozen=$expected" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image references
        id: images
        shell: bash
        env:
          SERVICES_TAG: ${{ steps.candidate.outputs.services_tag }}
          CHAIN_TAG: ${{ steps.candidate.outputs.chain_tag }}
          BITCOIN_TAG: ${{ steps.candidate.outputs.bitcoin_tag }}
        run: |
          set -euo pipefail
          resolve_image() {
            local output_name="$1"
            local image_name="$2"
            local tag="$3"
            local manifest digest reference
            manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
            digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$manifest")"
            reference="${image_name}@${digest}"
            docker buildx imagetools inspect "$reference" >/dev/null
            echo "${output_name}=${reference}" >>"$GITHUB_OUTPUT"
          }

          resolve_image services_image ghcr.io/buckyos/usdb-services "$SERVICES_TAG"
          resolve_image chain_image ghcr.io/buckyos/usdb-chain "$CHAIN_TAG"
          resolve_image bitcoin_image ghcr.io/buckyos/usdb-bitcoin-core "$BITCOIN_TAG"

      - name: Verify image existence and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
          SERVICES_IMAGE: ${{ steps.images.outputs.services_image }}
          CHAIN_IMAGE: ${{ steps.images.outputs.chain_image }}
          BITCOIN_IMAGE: ${{ steps.images.outputs.bitcoin_image }}
        run: |
          set -euo pipefail
          verify_image() {
            local reference="$1"
            local repository="$2"
            local workflow="$3"
            local revision="$4"
            docker buildx imagetools inspect "$reference" >/dev/null
            gh attestation verify "oci://${reference}" \
              --bundle-from-oci \
              --repo "$repository" \
              --signer-workflow "$workflow" \
              --source-digest "$revision" \
              --deny-self-hosted-runners
          }

          verify_image \
            "$SERVICES_IMAGE" \
            buckyos/usdb \
            buckyos/usdb/.github/workflows/usdb-services-image.yml \
            "$USDB_REVISION"
          verify_image \
            "$CHAIN_IMAGE" \
            buckyos/go-ethereum \
            buckyos/go-ethereum/.github/workflows/usdb-chain-image.yml \
            "$GO_ETHEREUM_REVISION"
          verify_image \
            "$BITCOIN_IMAGE" \
            buckyos/usdb \
            buckyos/usdb/.github/workflows/usdb-bitcoin-image.yml \
            "$USDB_REVISION"

      - name: Create and revalidate cross-repository manifest
        id: manifest
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CREATED_AT_UTC: ${{ steps.revisions.outputs.created_at_utc }}
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
          SERVICES_IMAGE: ${{ steps.images.outputs.services_image }}
          CHAIN_IMAGE: ${{ steps.images.outputs.chain_image }}
          BITCOIN_IMAGE: ${{ steps.images.outputs.bitcoin_image }}
        run: |
          set -euo pipefail
          mkdir -p release-output
          manifest="release-output/usdb-release-manifest.json"
          python3 usdb/docker/scripts/tools/release_manifest.py create \
            --bundle-dir usdb/docker/networks/testnet-v0 \
            --output "$manifest" \
            --release-id "$RELEASE_ID" \
            --created-at-utc "$CREATED_AT_UTC" \
            --compatibility-lock go-ethereum/scripts/usdb/ci-revisions.json \
            --usdb-revision "$USDB_REVISION" \
            --go-ethereum-revision "$GO_ETHEREUM_REVISION" \
            --source-dao-revision "$SOURCE_DAO_REVISION" \
            --services-image "$SERVICES_IMAGE" \
            --chain-image "$CHAIN_IMAGE" \
            --bitcoin-image "$BITCOIN_IMAGE"
          python3 usdb/docker/scripts/tools/release_manifest.py validate \
            --bundle-dir usdb/docker/networks/testnet-v0 \
            --manifest "$manifest" \
            --compatibility-lock go-ethereum/scripts/usdb/ci-revisions.json
          (cd release-output && sha256sum usdb-release-manifest.json >usdb-release-manifest.json.sha256)
          manifest_sha256="$(cut -d ' ' -f 1 release-output/usdb-release-manifest.json.sha256)"
          echo "sha256=$manifest_sha256" >>"$GITHUB_OUTPUT"
          echo "snapshot_status=$(jq -r '.snapshot.status' "$manifest")" >>"$GITHUB_OUTPUT"

      - name: Upload candidate manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.release_id }}-manifest
          path: release-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record release candidate
        shell: bash
        run: |
          {
            echo "### USDB release candidate manifest"
            echo
            echo "Release ID: \`${{ inputs.release_id }}\`"
            echo
            echo "Manifest SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo
            echo "Snapshot status: \`${{ steps.manifest.outputs.snapshot_status }}\`"
            echo
            echo "This is a candidate artifact. Final release approval remains pending."
          } >>"$GITHUB_STEP_SUMMARY"
