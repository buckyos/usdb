name: USDB Release Candidate Manifest (select release tag)
run-name: USDB candidate ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      qualification_level:
        description: Highest completed CI qualification for this installable candidate
        required: true
        type: choice
        default: fast
        options:
          - fast
          - nightly
          - weekly

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read

concurrency:
  group: usdb-release-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Verify selected tag and create manifest
    if: github.repository == 'buckyos/usdb'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testnet-release-candidate
    steps:
      - name: Validate release ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^usdb-(testnet|mainnet)-v[0-9]+-r[1-9][0-9]*$ ]] || {
            echo "invalid USDB release ID: $RELEASE_ID" >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/tags/${RELEASE_ID}" ]] || {
            echo "::error title=Wrong workflow ref::Select tag ${RELEASE_ID} in 'Use workflow from'; current ref is ${GITHUB_REF}."
            echo "candidate workflow must run from refs/tags/${RELEASE_ID}; current ref is ${GITHUB_REF}" >&2
            echo "Retry: gh workflow run usdb-release-candidate.yml --repo ${GITHUB_REPOSITORY} --ref ${RELEASE_ID}" >&2
            exit 1
          }
          active_artifacts="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${RELEASE_ID}-manifest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')"
          [[ "$active_artifacts" == "0" ]] || {
            echo "an active candidate artifact already exists for ${RELEASE_ID}" >&2
            exit 1
          }

      - name: Check out release coordinator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          path: usdb
          fetch-depth: 0
          persist-credentials: false

      - name: Check out go-ethereum revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buckyos/go-ethereum
          ref: refs/tags/${{ github.ref_name }}
          path: go-ethereum
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated release tags and master ancestry
        id: revisions
        shell: bash
        env:
          RELEASE_ID: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local directory="$1"
            local branch="$2"
            local tag_ref="refs/tags/${RELEASE_ID}"
            local revision
            [[ "$(git -C "$directory" cat-file -t "$tag_ref")" == "tag" ]] || {
              echo "$directory release tag must be annotated: $RELEASE_ID" >&2
              exit 1
            }
            revision="$(git -C "$directory" rev-list -n 1 "$tag_ref")"
            [[ "$(git -C "$directory" rev-parse HEAD)" == "$revision" ]] || {
              echo "$directory checkout does not match release tag target" >&2
              exit 1
            }
            git -C "$directory" fetch --no-tags origin \
              "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git -C "$directory" merge-base --is-ancestor \
              "$revision" "refs/remotes/origin/${branch}" || {
              echo "$directory release tag target is not in ${branch} history" >&2
              exit 1
            }
            printf '%s\n' "$revision"
          }

          usdb_revision="$(verify_release_tag usdb master)"
          go_revision="$(verify_release_tag go-ethereum master)"
          tagger_epoch="$(git -C usdb for-each-ref \
            --format='%(taggerdate:unix)' "refs/tags/${RELEASE_ID}")"
          [[ "$tagger_epoch" =~ ^[0-9]+$ ]] || {
            echo "USDB release tag has no canonical tagger timestamp" >&2
            exit 1
          }
          created_at="$(date -u --date="@${tagger_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          go_release_version="$(jq -er '.toolchains.go_release' \
            go-ethereum/scripts/usdb/ci-revisions.json)"
          [[ "$go_release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release Go toolchain version: $go_release_version" >&2
            exit 1
          }
          {
            echo "usdb_revision=$usdb_revision"
            echo "go_ethereum_revision=$go_revision"
            echo "created_at_utc=$created_at"
            echo "go_release_version=$go_release_version"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve compatibility lock and image-producing runs
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.ref_name }}
          QUALIFICATION_LEVEL: ${{ inputs.qualification_level }}
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
        run: |
          set -euo pipefail
          python3 go-ethereum/scripts/usdb/ci_revisions.py validate
          source_dao_revision="$(jq -er \
            '.dependencies.source_dao.revision' \
            go-ethereum/scripts/usdb/ci-revisions.json)"
          gh api \
            "/repos/buckyos/usdb/actions/workflows/usdb-release-build.yml/runs?event=push&status=success&head_sha=${USDB_REVISION}&per_page=100" \
            >usdb-release-runs.json
          gh api \
            "/repos/buckyos/go-ethereum/actions/workflows/usdb-release-build.yml/runs?event=push&status=success&head_sha=${GO_ETHEREUM_REVISION}&per_page=100" \
            >go-release-runs.json
          gh api \
            "/repos/buckyos/SourceDAO/actions/workflows/usdb-fast.yml/runs?event=push&status=success&head_sha=${source_dao_revision}&per_page=100" \
            >source-dao-fast-runs.json
          printf '%s\n' '{"workflow_runs":[]}' >qualification-runs.json
          if [[ "$QUALIFICATION_LEVEL" != "fast" ]]; then
            gh api \
              "/repos/buckyos/go-ethereum/actions/workflows/usdb-${QUALIFICATION_LEVEL}.yml/runs?status=success&head_sha=${GO_ETHEREUM_REVISION}&per_page=100" \
              >qualification-runs.json
          fi
          python3 usdb/docker/scripts/tools/release_candidate_resolver.py \
            --compatibility-lock go-ethereum/scripts/usdb/ci-revisions.json \
            --usdb-runs usdb-release-runs.json \
            --go-runs go-release-runs.json \
            --source-dao-runs source-dao-fast-runs.json \
            --qualification-runs qualification-runs.json \
            --usdb-revision "$USDB_REVISION" \
            --go-ethereum-revision "$GO_ETHEREUM_REVISION" \
            --release-id "$RELEASE_ID" \
            --qualification-level "$QUALIFICATION_LEVEL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out SourceDAO revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buckyos/SourceDAO
          ref: ${{ steps.candidate.outputs.source_dao_revision }}
          path: SourceDAO
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SourceDAO revision and main ancestry
        shell: bash
        env:
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
        run: |
          set -euo pipefail
          [[ "$(git -C SourceDAO rev-parse HEAD)" == "$SOURCE_DAO_REVISION" ]]
          git -C SourceDAO fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git -C SourceDAO merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "SourceDAO revision is not in main history" >&2
            exit 1
          }

      - name: Require successful SourceDAO CI check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
        run: |
          set -euo pipefail
          require_check() {
            local repository="$1"
            local revision="$2"
            local check_name="$3"
            local count
            count="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${repository}/commits/${revision}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${check_name}\" and .conclusion == \"success\")] | length")"
            [[ "$count" -gt 0 ]] || {
              echo "Missing successful check '$check_name' for ${repository}@${revision}" >&2
              exit 1
            }
          }

          require_check buckyos/SourceDAO "$SOURCE_DAO_REVISION" "SourceDAO contracts"

      - name: Verify selected cross-repository compatibility lock
        run: >-
          python3 go-ethereum/scripts/usdb/ci_revisions.py verify
          --workspace-root "$GITHUB_WORKSPACE"

      - name: Verify shared project skills
        run: >-
          python3 usdb/docker/scripts/tools/sync_project_skills.py check
          --workspace-root "$GITHUB_WORKSPACE"

      - name: Validate frozen network bundle
        run: >-
          python3 usdb/docker/scripts/tools/validate_network_bundle.py
          --bundle-dir usdb/docker/networks/testnet-v0

      - name: Set up release Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.revisions.outputs.go_release_version }}
          check-latest: false
          cache: false

      - name: Recompute frozen genesis block hash
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -er '.block_hash' \
            usdb/docker/networks/testnet-v0/artifacts/usdb-genesis.manifest.json)"
          actual="$(cd go-ethereum && go run ./cmd/usdb-genesis-hash \
            ../usdb/docker/networks/testnet-v0/artifacts/usdb-genesis.json)"
          [[ "$actual" == "$expected" ]] || {
            echo "genesis block hash mismatch: computed=$actual frozen=$expected" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image references
        id: images
        shell: bash
        env:
          SERVICES_TAG: ${{ steps.candidate.outputs.services_tag }}
          CHAIN_TAG: ${{ steps.candidate.outputs.chain_tag }}
          BITCOIN_TAG: ${{ steps.candidate.outputs.bitcoin_tag }}
        run: |
          set -euo pipefail
          resolve_image() {
            local output_name="$1"
            local image_name="$2"
            local tag="$3"
            local manifest digest reference
            manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
            digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$manifest")"
            reference="${image_name}@${digest}"
            docker buildx imagetools inspect "$reference" >/dev/null
            echo "${output_name}=${reference}" >>"$GITHUB_OUTPUT"
          }

          resolve_image services_image ghcr.io/buckyos/usdb-services "$SERVICES_TAG"
          resolve_image chain_image ghcr.io/buckyos/usdb-chain "$CHAIN_TAG"
          resolve_image bitcoin_image ghcr.io/buckyos/usdb-bitcoin-core "$BITCOIN_TAG"

      - name: Verify image existence and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
          SERVICES_IMAGE: ${{ steps.images.outputs.services_image }}
          CHAIN_IMAGE: ${{ steps.images.outputs.chain_image }}
          BITCOIN_IMAGE: ${{ steps.images.outputs.bitcoin_image }}
        run: |
          set -euo pipefail
          verify_image() {
            local reference="$1"
            local repository="$2"
            local workflow="$3"
            local revision="$4"
            docker buildx imagetools inspect "$reference" >/dev/null
            gh attestation verify "oci://${reference}" \
              --bundle-from-oci \
              --repo "$repository" \
              --signer-workflow "$workflow" \
              --source-digest "$revision" \
              --deny-self-hosted-runners
          }

          verify_image \
            "$SERVICES_IMAGE" \
            buckyos/usdb \
            buckyos/usdb/.github/workflows/usdb-services-image.yml \
            "$USDB_REVISION"
          verify_image \
            "$CHAIN_IMAGE" \
            buckyos/go-ethereum \
            buckyos/go-ethereum/.github/workflows/usdb-chain-image.yml \
            "$GO_ETHEREUM_REVISION"
          verify_image \
            "$BITCOIN_IMAGE" \
            buckyos/usdb \
            buckyos/usdb/.github/workflows/usdb-bitcoin-image.yml \
            "$USDB_REVISION"

      - name: Verify approved snapshot publication
        shell: bash
        run: |
          set -euo pipefail
          python3 usdb/docker/scripts/tools/snapshot_distribution.py verify-public \
            --record usdb/docker/networks/testnet-v0/snapshots/balance-history-snapshot-release-record.json \
            --trusted-keys usdb/docker/networks/testnet-v0/trust/usdb-mainnet-snapshot-v1.trusted-keys.json

      - name: Create and revalidate cross-repository manifest
        id: manifest
        shell: bash
        env:
          RELEASE_ID: ${{ github.ref_name }}
          CREATED_AT_UTC: ${{ steps.revisions.outputs.created_at_utc }}
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
          SERVICES_IMAGE: ${{ steps.images.outputs.services_image }}
          CHAIN_IMAGE: ${{ steps.images.outputs.chain_image }}
          BITCOIN_IMAGE: ${{ steps.images.outputs.bitcoin_image }}
          QUALIFICATION_LEVEL: ${{ steps.candidate.outputs.qualification_level }}
          QUALIFICATION_EVIDENCE_JSON: ${{ steps.candidate.outputs.qualification_evidence_json }}
        run: |
          set -euo pipefail
          mkdir -p release-output
          manifest="release-output/usdb-release-manifest.json"
          evidence="release-output/qualification-evidence.json"
          printf '%s\n' "$QUALIFICATION_EVIDENCE_JSON" >"$evidence"
          python3 usdb/docker/scripts/tools/release_manifest.py create \
            --bundle-dir usdb/docker/networks/testnet-v0 \
            --output "$manifest" \
            --release-id "$RELEASE_ID" \
            --created-at-utc "$CREATED_AT_UTC" \
            --compatibility-lock go-ethereum/scripts/usdb/ci-revisions.json \
            --usdb-revision "$USDB_REVISION" \
            --go-ethereum-revision "$GO_ETHEREUM_REVISION" \
            --source-dao-revision "$SOURCE_DAO_REVISION" \
            --services-image "$SERVICES_IMAGE" \
            --chain-image "$CHAIN_IMAGE" \
            --bitcoin-image "$BITCOIN_IMAGE" \
            --qualification-level "$QUALIFICATION_LEVEL" \
            --qualification-evidence "$evidence"
          rm "$evidence"
          python3 usdb/docker/scripts/tools/release_manifest.py validate \
            --bundle-dir usdb/docker/networks/testnet-v0 \
            --manifest "$manifest" \
            --compatibility-lock go-ethereum/scripts/usdb/ci-revisions.json
          (cd release-output && sha256sum usdb-release-manifest.json >usdb-release-manifest.json.sha256)
          manifest_sha256="$(cut -d ' ' -f 1 release-output/usdb-release-manifest.json.sha256)"
          {
            echo "sha256=$manifest_sha256"
            echo "snapshot_status=$(jq -r '.snapshot.status' "$manifest")"
            echo "snapshot_height=$(jq -r '.snapshot.height' "$manifest")"
            echo "snapshot_record_url=$(jq -r '.snapshot.record.url' "$manifest")"
            echo "qualification_level=$(jq -r '.qualification.level' "$manifest")"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve previous published release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle_id="${RELEASE_ID%-r*}"
          current_sequence="${RELEASE_ID##*-r}"
          previous_release_id=""
          mkdir -p previous-release
          while IFS= read -r tag; do
            [[ "$tag" =~ ^${bundle_id}-r([1-9][0-9]*)$ ]] || continue
            sequence="${BASH_REMATCH[1]}"
            (( sequence < current_sequence )) || continue
            if ! gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              >previous-release/release.json 2>/dev/null; then
              continue
            fi
            [[ "$(jq -r '.draft' previous-release/release.json)" == "false" ]] || continue
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir previous-release \
              --pattern usdb-release-manifest.json \
              --pattern usdb-release-manifest.json.sha256
            manifest_sha="$(cut -d ' ' -f 1 \
              previous-release/usdb-release-manifest.json.sha256)"
            [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(cat previous-release/usdb-release-manifest.json.sha256)" == \
              "${manifest_sha}  usdb-release-manifest.json" ]]
            printf '%s  previous-release/usdb-release-manifest.json\n' \
              "$manifest_sha" | sha256sum -c -
            [[ "$(jq -er '.release_id' \
              previous-release/usdb-release-manifest.json)" == "$tag" ]]
            previous_release_id="$tag"
            break
          done < <(git -C usdb tag --list "${bundle_id}-r*" --sort=-version:refname)
          echo "previous_release_id=$previous_release_id" >>"$GITHUB_OUTPUT"

      - name: Generate cross-repository release changes
        id: release_changes
        shell: bash
        env:
          GO_ETHEREUM_REVISION: ${{ steps.revisions.outputs.go_ethereum_revision }}
          RELEASE_ID: ${{ github.ref_name }}
          SOURCE_DAO_REVISION: ${{ steps.candidate.outputs.source_dao_revision }}
          USDB_REVISION: ${{ steps.revisions.outputs.usdb_revision }}
        run: |
          set -euo pipefail
          previous_args=()
          previous_usdb="-"
          previous_go="-"
          previous_source_dao="-"
          if [[ -f previous-release/usdb-release-manifest.json ]]; then
            previous_args=(
              --previous-manifest previous-release/usdb-release-manifest.json
            )
            previous_usdb="$(jq -er '.repositories.usdb.revision' \
              previous-release/usdb-release-manifest.json)"
            previous_go="$(jq -er '.repositories.go_ethereum.revision' \
              previous-release/usdb-release-manifest.json)"
            previous_source_dao="$(jq -er '.repositories.source_dao.revision' \
              previous-release/usdb-release-manifest.json)"
          fi
          python3 usdb/docker/scripts/tools/release_notes.py generate \
            --release-id "$RELEASE_ID" \
            --manifest release-output/usdb-release-manifest.json \
            "${previous_args[@]}" \
            --repository usdb buckyos/usdb usdb \
              "$previous_usdb" "$USDB_REVISION" \
            --repository go_ethereum buckyos/go-ethereum go-ethereum \
              "$previous_go" "$GO_ETHEREUM_REVISION" \
            --repository source_dao buckyos/SourceDAO SourceDAO \
              "$previous_source_dao" "$SOURCE_DAO_REVISION" \
            --output-json release-output/release-changes.json \
            --output-markdown release-output/release-changes.md
          python3 usdb/docker/scripts/tools/release_notes.py validate-release \
            --release-id "$RELEASE_ID" \
            --manifest release-output/usdb-release-manifest.json \
            --changes release-output/release-changes.json
          (cd release-output && \
            sha256sum release-changes.json >release-changes.json.sha256)
          {
            echo "sha256=$(cut -d ' ' -f 1 release-output/release-changes.json.sha256)"
            echo "compatibility=$(jq -er '.compatibility.classification' release-output/release-changes.json)"
            echo "unclassified=$(jq '[.repositories[].coverage.unclassified] | add' release-output/release-changes.json)"
          } >>"$GITHUB_OUTPUT"

      - name: Upload candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.ref_name }}-manifest
          path: release-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record release candidate
        shell: bash
        run: |
          {
            echo "### USDB release candidate manifest"
            echo
            echo "Release ID: \`${{ github.ref_name }}\`"
            echo
            echo "Manifest SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo
            echo "Previous release: \`${{ steps.previous.outputs.previous_release_id || 'none' }}\`"
            echo
            echo "Upgrade classification: \`${{ steps.release_changes.outputs.compatibility }}\`"
            echo
            echo "Unclassified commits: \`${{ steps.release_changes.outputs.unclassified }}\` (report-only in v1)"
            echo
            echo "Release changes SHA-256: \`${{ steps.release_changes.outputs.sha256 }}\`"
            echo
            echo "Qualification: \`${{ steps.manifest.outputs.qualification_level }}\`"
            echo
            echo "Snapshot status: \`${{ steps.manifest.outputs.snapshot_status }}\`"
            echo
            echo "Snapshot height: \`${{ steps.manifest.outputs.snapshot_height }}\`"
            echo
            echo "Snapshot record: ${{ steps.manifest.outputs.snapshot_record_url }}"
            echo
            echo "This is a candidate artifact. Final release approval remains pending."
          } >>"$GITHUB_STEP_SUMMARY"
