name: USDB Public Services CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ["public-services/**", "tools/public-rpc-gateway/**", "tests/test_public_services.py", "tests/test_public_installer.py", "tests/test_public_ingress.py", "tests/test_public_release_publish.py", "tests/common/public_services.py", "tests/common/public_installer.py", "tests/common/public_release.py", "docker/networks/testnet-v0/**", ".github/workflows/usdb-public-*.yml"]
  push:
    branches: [master]
    paths: ["public-services/**", "tools/public-rpc-gateway/**", "tests/test_public_services.py", "tests/test_public_installer.py", "tests/test_public_ingress.py", "tests/test_public_release_publish.py", "tests/common/public_services.py", "tests/common/public_installer.py", "tests/common/public_release.py", "docker/networks/testnet-v0/**", ".github/workflows/usdb-public-*.yml"]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/public-rpc-gateway/go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
          check-latest: false
      - name: Test gateway method policy, TLS and separate broadcast routing
        working-directory: tools/public-rpc-gateway
        run: go test -race ./...
      - name: Test independent deployment, ingress and packaging
        run: |
          python3 tests/test_public_services.py
          python3 tests/test_public_installer.py
          python3 tests/test_public_release_publish.py
          python3 public-services/package_release.py --check-network
          public-services/usdb-public --help
      - name: Exercise optional Nginx routing, HTTPS and reload in isolated containers
        run: python3 tests/test_public_ingress.py
      - name: Check generic node resource reservation and node-kit independence
        run: |
          python3 docker/scripts/tools/test_resource_policy.py
          python3 docker/scripts/tools/test_resource_controller.py
          python3 docker/scripts/tools/test_usdb_node.py
          python3 docker/scripts/tools/test_prepare_release_node_kit.py
