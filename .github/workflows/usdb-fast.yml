name: USDB Fast

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usdb-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fast:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out usdb
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
          check-latest: false

      - name: Check release image source review scope
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 .github/scripts/image_security_policy.py check-scope \
            --exceptions .github/security/image-vulnerability-exceptions.json \
            --repository-root .

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal --component clippy --component rustfmt

      - name: Check host preparation and node kit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash -n docker/scripts/tools/prepare_usdb_host.sh
          python3 docker/scripts/tools/test_prepare_usdb_host.py
          python3 tests/test_host_prepare.py
          python3 docker/scripts/tools/test_validate_network_bundle.py
          python3 docker/scripts/tools/test_usdb_node.py
          python3 docker/scripts/tools/test_prepare_release_node_kit.py
          python3 tests/test_node_peers.py

      - name: Run Rust fast gate
        run: src/btc/scripts/run_fast_ci.sh
