name: USDB Fast

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usdb-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fast:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out usdb
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
          check-latest: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal --component clippy --component rustfmt

      - name: Run Rust fast gate
        run: src/btc/scripts/run_fast_ci.sh

  publish_services_image:
    name: Publish USDB services image
    needs: rust-fast
    if: github.event_name == 'push' && github.repository == 'buckyos/usdb'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/usdb-services-image.yml
