# Opt-in Core-only overlay. Full node-kit/BH/chain wiring is handled separately.
services:
  btc-node:
    environment:
      SNAPSHOT_MODE: assumeutxo
      BH_ASSUMEUTXO_BASE_HEIGHT: ${BH_ASSUMEUTXO_BASE_HEIGHT:-935000}
      BTC_TXINDEX: ${BTC_TXINDEX:-0}
    volumes:
      - ${BTC_ASSUMEUTXO_ARTIFACT_HOST_DIR:?BTC_ASSUMEUTXO_ARTIFACT_HOST_DIR is required}:/data/assumeutxo:ro
    healthcheck:
      # This means a usable baseline, not tip sync or USDB consensus readiness.
      test: ["CMD", "python3", "/opt/usdb/docker/scripts/tools/bitcoin_assumeutxo.py", "status"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  btc-snapshot-bootstrap:
    image: ${USDB_BITCOIN_IMAGE:?USDB_BITCOIN_IMAGE must reference a digest-pinned release image}
    entrypoint: ["/usr/bin/tini", "--", "/opt/usdb/docker/scripts/entrypoints/bootstrap_bitcoin_core.sh"]
    restart: "no"
    user: ${BTC_CONTAINER_UID:-1000}:${BTC_CONTAINER_GID:-1000}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      btc-node:
        condition: service_started
    environment:
      SNAPSHOT_MODE: assumeutxo
      BTC_NETWORK: ${BTC_NETWORK:?BTC_NETWORK is required}
      BH_ASSUMEUTXO_BASE_HEIGHT: ${BH_ASSUMEUTXO_BASE_HEIGHT:-935000}
      BTC_ASSUMEUTXO_SNAPSHOT_FILE: /data/assumeutxo/mainnet-935000-utxos.dat
      BTC_ASSUMEUTXO_STATE_DIR: /data/assumeutxo-state
      BTC_ASSUMEUTXO_SOURCE_URL: ${BTC_ASSUMEUTXO_SOURCE_URL:-}
      BTC_RPC_URL: http://btc-node:8332
      BTC_RPC_USER: ${BTC_RPC_USER:?BTC_RPC_USER is required}
      BTC_RPC_PASSWORD: ${BTC_RPC_PASSWORD:?BTC_RPC_PASSWORD is required}
    volumes:
      - ${BTC_ASSUMEUTXO_ARTIFACT_HOST_DIR:?BTC_ASSUMEUTXO_ARTIFACT_HOST_DIR is required}:/data/assumeutxo
      - ${BTC_ASSUMEUTXO_STATE_HOST_DIR:?BTC_ASSUMEUTXO_STATE_HOST_DIR is required}:/data/assumeutxo-state
    mem_limit: 128m
    memswap_limit: 128m
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: ${USDB_LOG_MAX_SIZE:-100m}
        max-file: ${USDB_LOG_MAX_FILES:-5}
    networks:
      - usdb-runtime
