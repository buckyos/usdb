services:
  snapshot-loader:
    environment:
      BH_SYNC_UTXO_MAX_CACHE_BYTES: ${BH_SYNC_UTXO_MAX_CACHE_BYTES:-4294967296}
      BH_SYNC_BALANCE_MAX_CACHE_BYTES: ${BH_SYNC_BALANCE_MAX_CACHE_BYTES:-12884901888}
      BH_SYNC_MAX_MEMORY_PERCENT: ${BH_SYNC_MAX_MEMORY_PERCENT:-85}

  balance-history:
    mem_limit: ${BH_MEMORY_LIMIT:-24g}
    memswap_limit: ${BH_MEMORY_SWAP_LIMIT:-24g}
    environment:
      BH_SYNC_UTXO_MAX_CACHE_BYTES: ${BH_SYNC_UTXO_MAX_CACHE_BYTES:-4294967296}
      BH_SYNC_BALANCE_MAX_CACHE_BYTES: ${BH_SYNC_BALANCE_MAX_CACHE_BYTES:-12884901888}
      BH_SYNC_MAX_MEMORY_PERCENT: ${BH_SYNC_MAX_MEMORY_PERCENT:-85}
